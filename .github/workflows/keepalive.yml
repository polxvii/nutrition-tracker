name: Supabase keepalive

# Supabase free tier pauses a project after 7 days with no activity. This runs
# once a day and makes a read-only request that reaches Postgres, which counts
# as activity and keeps the project awake. It also nudges the repo every ~50
# days so GitHub doesn't auto-disable this scheduled workflow (that happens
# after 60 days of no repo activity).

on:
  schedule:
    - cron: '17 3 * * *' # daily at 03:17 UTC
  workflow_dispatch: {} # allow manual "Run workflow"

# Needed only for the 60-day anti-disable empty commit.
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      # Public anon/publishable key — safe to commit (it's already shipped in
      # the browser bundle and is gated by Row Level Security).
      # NEVER put the service_role key here.
      SUPABASE_URL: https://uqtzfwnqsjwwryehjlna.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxdHpmd25xc2p3d3J5ZWhqbG5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NjY5NDUsImV4cCI6MjEwMDA0Mjk0NX0.u47MYCLlV8vZpEdYlWkvRmBBPekAw_KaE62RR71dFyA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase (keep the project active)
        run: |
          set -uo pipefail

          # 1) REST read — this reaches PostgREST/Postgres (the row-level
          #    permission check runs *in the database*), so it counts as real
          #    database activity. A 401 is EXPECTED here: the anon role has no
          #    table grant, and Postgres answers with error 42501. That still
          #    proves the DB responded, which is exactly what we want.
          rest_code=$(curl -sS -m 30 -o /tmp/rest.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY") || rest_code=000
          echo "REST   -> HTTP $rest_code"
          cat /tmp/rest.json 2>/dev/null || true
          echo

          # 2) Auth health — a clean liveness signal. A paused or down project
          #    fails this, which turns the run red and emails you.
          health_code=$(curl -sS -m 30 -o /tmp/health.json -w '%{http_code}' \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY") || health_code=000
          echo "HEALTH -> HTTP $health_code"
          cat /tmp/health.json 2>/dev/null || true
          echo

          # Alive when auth health is 2xx AND the REST call reached the DB
          # (200 = readable, 401 = permission-denied-by-Postgres). Anything else
          # (000 no-response, 5xx, project-paused page) fails the run.
          if [[ "$health_code" =~ ^2[0-9][0-9]$ ]] && { [[ "$rest_code" == "200" ]] || [[ "$rest_code" == "401" ]]; }; then
            echo "✅ Supabase is active."
          else
            echo "❌ Unexpected response — the project may be paused or down."
            exit 1
          fi

      - name: Keep this workflow enabled (nudge repo every ~50 days)
        run: |
          set -uo pipefail
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit was $age_days day(s) ago."
          if [ "$age_days" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive bump [skip ci]"
            if git push; then
              echo "Pushed an empty commit to reset the 60-day timer."
            else
              echo "::warning::Could not push. Enable Settings > Actions > General > Workflow permissions > Read and write permissions."
            fi
          else
            echo "No nudge needed yet (bumps at 50 days)."
          fi
